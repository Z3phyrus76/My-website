<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Michael Joy Boy</title>

<style>
  :root{
    --luffy-image: url("japan-2025-photos/luffy-birthday.png");
    --bg1:#7a0000; --bg2:#b30000; --bg3:#e10600; --bg4:#ff4040;
    --ink:#2b2b2b; --bubble-bg:#fff; --bubble-border:#2b2b2b;

    --gap:24px;
    --img-min:260px;
    --img-max:480px;
    --img-aspect:340/637;
  }

  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    display:grid; place-items:center; padding:24px; box-sizing:border-box;

    background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
    background-size:400% 400%;
    animation:bgShift 14s ease-in-out infinite;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  /* ---------- PERSISTENT SPOTIFY PLAYER ---------- */
  #spotifyPlayer{ position:fixed; z-index:10000; transition:all .5s ease; }
  /* splash state (centered, large, at bottom) */
  #spotifyPlayer.player--splash{
    width:min(560px,94vw);
    left:50%; transform:translateX(-50%);
    bottom:4vh; /* a little higher so it’s not too close to edge */
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));
  }
  #spotifyPlayer.player--splash iframe{
    width:100%; height:152px; border-radius:12px; border:0;
  }
  /* mini state after Enter */
  #spotifyPlayer.player--mini{
    width:min(320px,92vw);
    right:12px; bottom:12px; left:auto; transform:none;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));
  }
  #spotifyPlayer.player--mini iframe{
    width:100%; height:80px; border-radius:12px; border:0;
  }

  /* ---------- LOADER OVERLAY ---------- */
  .splash{
    position:fixed; inset:0; z-index:9999; /* below the player; player remains clickable */
    display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; padding:20px;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,255,255,.12), transparent 55%),
      linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
    background-size:400% 400%; animation:bgShift 14s ease-in-out infinite;
  }
  .splash-inner{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    width:min(560px,94vw);
    /* reserve space so the player never overlaps content */
    padding-bottom:190px;  /* ~152px player + breathing room */
  }
  .splash-gif{
    width:min(48vmin,360px); height:auto; border-radius:14px;
    box-shadow:0 18px 48px rgba(0,0,0,.45); transition:opacity .25s ease;
  }
  .hide{ opacity:0 }

  .splash-caption{
    font-weight:800; letter-spacing:.4px; text-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .splash-instruction{
    margin-top:6px; font-weight:700; opacity:.9;
    text-shadow:0 2px 6px rgba(0,0,0,.25);
  }

  .controls{ display:flex; gap:10px; justify-content:center; margin-top:6px }
  .btn{
    appearance:none; border:none; border-radius:10px; padding:10px 16px;
    background:#ffffff; color:#111; font-weight:800; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
  }
  .btn:active{ transform:translateY(1px) }

  .fade-out{ animation:fadeOut .6s ease forwards }
  @keyframes fadeOut{ to{opacity:0; visibility:hidden} }

  /* ---------- MAIN APP ---------- */
  .app{ opacity:0; transition:opacity .6s ease }
  .app.show{ opacity:1 }

  .card{
    display:flex; align-items:flex-start; justify-content:center;
    gap:var(--gap); flex-wrap:wrap; max-width:1100px; width:100%;
  }
  .luffy{
    width:clamp(var(--img-min), 40vw, var(--img-max));
    aspect-ratio:var(--img-aspect);
    background-image:var(--luffy-image);
    background-size:cover;
    background-position:center top;
    border-radius:14px;
    box-shadow:0 16px 40px rgba(0,0,0,.35);
    transform:translateY(24px);
    opacity:0; animation:slideUp .7s ease-out forwards;
  }
  .bubble{
    position:relative; background:var(--bubble-bg);
    border:2px solid var(--bubble-border);
    border-radius:16px; box-shadow:0 12px 28px rgba(0,0,0,.2);
    padding:18px 22px; max-width:520px; min-width:260px; line-height:1.4;
    transform:translateY(16px) scale(.98);
    opacity:0; animation:popIn .6s ease-out .2s forwards;
    background-clip:padding-box;
  }
  .bubble::after{
    content:""; position:absolute; left:-18px; top:28px; width:0; height:0;
    border-top:14px solid transparent; border-bottom:14px solid transparent;
    border-right:18px solid var(--bubble-bg);
    filter:drop-shadow(-2px 2px 0 var(--bubble-border));
  }
  .shout{ font-weight:800; font-size:clamp(20px,3.2vw,28px); letter-spacing:.3px }
  .from { margin-top:14px; font-weight:600; font-size:18px; opacity:.9 }

  @keyframes slideUp{to{transform:translateY(0);opacity:1}}
  @keyframes popIn{to{transform:translateY(0) scale(1);opacity:1}}

  /* iPhone tweaks */
  @media (max-width:620px){
    .card{flex-direction:column; align-items:center}
    .bubble{text-align:center}
    .bubble::after{
      left:50%; top:-20px; transform:translateX(-50%);
      border-top:0; border-bottom:20px solid var(--bubble-bg);
      border-right:14px solid transparent; border-left:14px solid transparent;
      filter:drop-shadow(0 -2px 0 var(--bubble-border));
    }
    /* slightly smaller player + more reserved space on small screens */
    #spotifyPlayer.player--splash iframe{ height:120px }
    .splash-inner{ padding-bottom:150px }
  }
</style>
</head>
<body>

  <!-- SPOTIFY (tap Play on loader; keeps playing after Enter) -->
  <div id="spotifyPlayer" class="player--splash" aria-label="Spotify player">
    <iframe
      src="https://open.spotify.com/embed/track/2hXPmiqKdXcbV0L1VKnTDN?utm_source=generator"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>

  <!-- LOADER with looping 3-GIF sequence -->
  <div id="splash" class="splash" aria-label="Loading birthday surprise">
    <div class="splash-inner">
      <img id="splashImg" class="splash-gif" src="" alt="Nika / Gear 5 sequence">
      <div id="splashCaption" class="splash-caption">Me running away from my problems</div>
      <div class="splash-instruction">Tap Play in Spotify if you want music, then hit Enter →</div>
      <div class="controls">
        <button id="enterBtn" class="btn">Enter</button>
      </div>
    </div>
  </div>

  <!-- MAIN CARD -->
  <div id="app" class="app">
    <main class="card" aria-label="Luffy presenting a birthday cake with a message">
      <div class="luffy" role="img" aria-label="Monkey D. Luffy holding a birthday cake"></div>
      <div class="bubble">
        <div class="shout">HAPPY BIRTHDAY<br>MICHAEL SOLOMON GRIEGO!!!</div>
        <div class="from">– Monkey D. Luffy 🏴‍☠️</div>
      </div>
    </main>
  </div>

<script>
  /* ---------- CONFIG ---------- */
  const BASE = "japan-2025-photos/";
  const EXT  = ".gif"; // change if your loaders are .webp

  const FRAMES = [
    { file: "nika-sungod",        caption: "Me running away from my problems", ms: 1400 },
    { file: "nika-sungod-gear5",  caption: "Me everytime I see a mirror",      ms: 1400 },
    { file: "nika-sungod-laugh",  caption: "Me laughing at my own jokes",      ms: 1400 },
  ];

  // Preload assets
  const preloadCard = new Image(); preloadCard.src = BASE + "luffy-birthday.png";
  FRAMES.forEach(f => { const i = new Image(); i.src = BASE + f.file + EXT; });

  const splash        = document.getElementById("splash");
  const splashImg     = document.getElementById("splashImg");
  const splashCaption = document.getElementById("splashCaption");
  const enterBtn      = document.getElementById("enterBtn");
  const app           = document.getElementById("app");
  const playerBox     = document.getElementById("spotifyPlayer");

  // Loop the 3-GIF sequence until Enter
  let running = true;
  function loopFrames(i = 0){
    if (!running) return;
    const f = FRAMES[i % FRAMES.length];

    splashImg.classList.add("hide");
    setTimeout(() => {
      splashImg.onload = () => splashImg.classList.remove("hide");
      splashImg.src = BASE + f.file + EXT;
      splashCaption.textContent = f.caption;
    }, 120);

    setTimeout(() => loopFrames(i + 1), f.ms);
  }
  window.addEventListener("load", () => loopFrames(0));

  // Enter → stop loop, fade out splash, show app, shrink player (keeps playing)
  enterBtn.addEventListener("click", () => {
    running = false;
    splash.classList.add("fade-out");
    app.classList.add("show");
    playerBox.classList.remove("player--splash");
    playerBox.classList.add("player--mini");
    setTimeout(() => splash.remove(), 650);
  });
</script>

</body>
</html>
