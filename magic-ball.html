<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Message Ball</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Optional Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050315;
      color: #f7f7ff;
      transition: background 0.6s ease;
    }

    /* THEME VARIANTS (all girly-pop) */
    body.theme-1 {
      background:
        radial-gradient(circle at top left, #ff9ee533, transparent 55%),
        radial-gradient(circle at bottom right, #7f5bff33, #160018 70%);
    }

    body.theme-2 {
      background:
        radial-gradient(circle at top left, #ffc6a533, transparent 55%),
        radial-gradient(circle at bottom right, #ff6fb733, #1a0010 70%);
    }

    body.theme-3 {
      background:
        radial-gradient(circle at top left, #bba7ff33, transparent 55%),
        radial-gradient(circle at bottom right, #ff8fdf33, #100020 70%);
    }

    body.theme-4 {
      background:
        radial-gradient(circle at top left, #ffe3ff33, transparent 55%),
        radial-gradient(circle at bottom right, #ff4d9733, #180012 70%);
    }

    .app {
      width: 100%;
      max-width: 720px;
      padding: 32px 20px 40px;
      text-align: center;
    }

    .title {
      font-size: 2.1rem;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .ball-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
    }

    /* colored glow behind ball */
    .ball-glow {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(26px);
      opacity: 0.98;
      transition: background 0.6s ease, opacity 0.6s ease;
    }

    body.theme-1 .ball-glow {
      background:
        radial-gradient(circle at 15% 5%, #ffffff66, transparent 55%),
        radial-gradient(circle, #ff8ad8, #6a35ff 70%);
    }

    body.theme-2 .ball-glow {
      background:
        radial-gradient(circle at 15% 5%, #ffffff66, transparent 55%),
        radial-gradient(circle, #ffb18a, #ff3f91 70%);
    }

    body.theme-3 .ball-glow {
      background:
        radial-gradient(circle at 15% 5%, #ffffff66, transparent 55%),
        radial-gradient(circle, #bda8ff, #5c3bff 70%);
    }

    body.theme-4 .ball-glow {
      background:
        radial-gradient(circle at 15% 5%, #ffffff66, transparent 55%),
        radial-gradient(circle, #ffb6ff, #ff2f7c 70%);
    }

    .ball {
      position: relative;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 20%, #a0a0a0, transparent 55%),
        radial-gradient(circle at 70% 80%, #111119, #000000 75%);
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.02),
        0 40px 80px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.18s ease-out, box-shadow 0.18s ease-out;
      -webkit-tap-highlight-color: transparent;
    }

    .ball:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.03),
        0 50px 100px rgba(0, 0, 0, 0.95);
    }

    /* inner window (bigger square) */
    .ball-window {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
      transition: background 0.6s ease, box-shadow 0.6s ease;
      background:
        radial-gradient(circle at 20% 0%, #ffffff55, transparent 55%),
        radial-gradient(circle at 50% 120%, #000b44, #001080 75%);
      box-shadow:
        0 0 40px rgba(22, 113, 255, 0.85),
        inset 0 0 12px rgba(0, 0, 0, 0.6);
    }

    body.theme-1 .ball-window {
      background:
        radial-gradient(circle at 20% 0%, #ffffff88, transparent 55%),
        radial-gradient(circle at 50% 120%, #ff9bd6, #7f5bff 75%);
      box-shadow:
        0 0 45px rgba(255, 119, 198, 0.95),
        inset 0 0 10px rgba(0, 0, 0, 0.4);
    }

    body.theme-2 .ball-window {
      background:
        radial-gradient(circle at 20% 0%, #ffffff88, transparent 55%),
        radial-gradient(circle at 50% 120%, #ffc38b, #ff5fa9 75%);
      box-shadow:
        0 0 45px rgba(255, 165, 141, 0.95),
        inset 0 0 10px rgba(0, 0, 0, 0.4);
    }

    body.theme-3 .ball-window {
      background:
        radial-gradient(circle at 20% 0%, #ffffff88, transparent 55%),
        radial-gradient(circle at 50% 120%, #c8b9ff, #7c5bff 75%);
      box-shadow:
        0 0 45px rgba(187, 167, 255, 0.95),
        inset 0 0 10px rgba(0, 0, 0, 0.4);
    }

    body.theme-4 .ball-window {
      background:
        radial-gradient(circle at 20% 0%, #ffffff88, transparent 55%),
        radial-gradient(circle at 50% 120%, #ffb6ff, #ff3fa8 75%);
      box-shadow:
        0 0 45px rgba(255, 140, 214, 0.95),
        inset 0 0 10px rgba(0, 0, 0, 0.4);
    }

    .window-text {
      font-size: 0.82rem;
      font-weight: 400;
      color: #e6eeff;
      text-shadow: 0 0 8px #000000;
      text-align: center;
      line-height: 1.25;
    }

    .tap-label {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.85;
    }

    /* Shake animation */
    .ball.shake {
      animation: shake 0.7s ease-in-out;
    }

    @keyframes shake {
      0%   { transform: translate(0, 0) rotate(0deg); }
      15%  { transform: translate(-4px, 2px) rotate(-3deg); }
      30%  { transform: translate(4px, -2px) rotate(3deg); }
      45%  { transform: translate(-3px, 1px) rotate(-2deg); }
      60%  { transform: translate(3px, -1px) rotate(2deg); }
      75%  { transform: translate(-2px, 1px) rotate(-1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* Text pop animation */
    .pop {
      animation: popIn 0.45s ease-out;
    }

    @keyframes popIn {
      0%   { transform: scale(0.85); opacity: 0; }
      60%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Button row */
    .controls {
      margin: 0 auto;
      max-width: 540px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }

    .shake-btn {
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 0 20px rgba(72, 91, 255, 0.75),
        0 12px 35px rgba(0, 0, 0, 0.9);
      transition: transform 0.16s ease-out, box-shadow 0.16s ease-out, opacity 0.16s, background 0.6s ease;
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(circle at 20% 0%, #ffffff44, transparent 55%),
        linear-gradient(135deg, #2636ff, #711fff);
    }

    body.theme-1 .shake-btn {
      background:
        radial-gradient(circle at 20% 0%, #ffffff66, transparent 55%),
        linear-gradient(135deg, #ff6fb9, #8f5bff);
      box-shadow:
        0 0 22px rgba(255, 119, 198, 0.9),
        0 14px 38px rgba(0, 0, 0, 1);
    }

    body.theme-2 .shake-btn {
      background:
        radial-gradient(circle at 20% 0%, #ffffff66, transparent 55%),
        linear-gradient(135deg, #ff9f7a, #ff4fa2);
      box-shadow:
        0 0 22px rgba(255, 158, 122, 0.9),
        0 14px 38px rgba(0, 0, 0, 1);
    }

    body.theme-3 .shake-btn {
      background:
        radial-gradient(circle at 20% 0%, #ffffff66, transparent 55%),
        linear-gradient(135deg, #bda7ff, #7f5bff);
      box-shadow:
        0 0 22px rgba(187, 167, 255, 0.9),
        0 14px 38px rgba(0, 0, 0, 1);
    }

    body.theme-4 .shake-btn {
      background:
        radial-gradient(circle at 20% 0%, #ffffff66, transparent 55%),
        linear-gradient(135deg, #ff8fd3, #ff3fa8);
      box-shadow:
        0 0 22px rgba(255, 143, 211, 0.9),
        0 14px 38px rgba(0, 0, 0, 1);
    }

    .shake-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 0 24px rgba(110, 119, 255, 1),
        0 16px 45px rgba(0, 0, 0, 1);
    }

    .shake-btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow:
        0 0 14px rgba(72, 91, 255, 0.6),
        0 9px 25px rgba(0, 0, 0, 0.9);
    }

    .footer-hint {
      margin-top: 18px;
      font-size: 0.78rem;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .ball {
        width: 260px;
        height: 260px;
      }
      .ball-glow {
        width: 290px;
        height: 290px;
      }
      .ball-window {
        width: 150px;
        height: 150px;
        padding: 8px;
      }
      .window-text {
        font-size: 0.78rem;
      }
      .title {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 class="title">Make Your Delulu the Solulu 🔮</h1>
<p class="subtitle">
  Tap the ball and let your <strong>delulu</strong> turn into your soft-life <strong>solulu</strong>, twin.
</p>


    <div class="ball-wrapper">
      <div class="ball-glow"></div>

      <div id="magicBall" class="ball">
        <div class="ball-window">
          <div id="windowText" class="window-text">
            Tap to get a message 💫
          </div>
        </div>
        <div class="tap-label">Tap / Click</div>
      </div>
    </div>

    <div class="controls">
      <button id="shakeButton" class="shake-btn">
        SHAKE 8 BALL
      </button>
    </div>

    <p class="footer-hint">Tip: Click as many times as you want. The universe is chatty.</p>
  </div>

  <script>
    // Messages with bold/italic emphasis (using HTML)
    const messages = [
      "Treat yourself, <strong>twin</strong>. You deserve a <em>little extra</em> today. 💅",
      "<strong>Tiny progress</strong> is still progress, do not downplay it.",
      "You are doing <strong>so much better</strong> than you <em>think</em> you are.",
      "Reminder: You are not behind. You are on <strong>your</strong> timeline, not anyone else&apos;s.",
      "Drink some water and <em>fix your posture</em>, bestie. 💧",
      "Someone out there is <strong>grateful</strong> you exist. (<em>Yes, you.</em>)",
      "Soft life is <strong>loading</strong>… keep going. ✨",
      "Take a deep breath, <em>unclench your jaw</em>, relax your shoulders.",
      "Future you is already <strong>proud</strong> of you.",
      "You are the <strong>main character</strong>. Act accordingly. 🎬",
      "<em>Rest</em> is productive too. Log off for a bit.",
      "A new opportunity is <strong>on its way</strong>. Stay open to it.",
      "You <strong>ate</strong>. No crumbs. 🧹",
      "Romanticize your life, <em>even the boring parts</em>.",
      "The people meant for you will <strong>never</strong> be confused about you.",
      "You do not need to have it all <em>figured out</em> right now.",
      "Okay but… you are actually <strong>iconic</strong>.",
      "Take yourself on a <strong>solo date</strong> this week. 💖",
      "You are allowed to <em>start over</em> as many times as you need.",
      "Trust that what is for you will <strong>not miss you</strong>.",
      "You survived <strong>every bad day</strong> so far. That is a 100% success rate.",
      "Your <strong>kindness</strong> is a flex. Do not downplay it.",
      "Today&apos;s vibe: <em>gentle</em> with yourself, <strong>serious</strong> about your goals.",
      "You are not &quot;too much&quot;. You are just <strong>not for everyone</strong>, and that is okay.",
      "Somebody wishes they had your <strong>smile</strong>, your laugh, your energy.",
      "Celebrate the <strong>tiny wins</strong> the same way you celebrate the big ones.",
      "You are allowed to <em>rest</em> without earning it.",
      "You bring <strong>good energy</strong> into rooms you enter.",
      "Do not rush. What is meant for you is already <strong>on its way</strong>.",
      "You are more capable than the voice in your head <em>claims</em> you are.",
      "Your future self is sending you a <strong>standing ovation</strong> right now.",
      "Be as <em>patient</em> with yourself as you are with people you love.",
      "You are not falling behind. You are <strong>building quietly</strong>.",
      "Your heart is a <strong>soft place</strong> in a loud world. Protect it.",
      "You will look back and be glad you <em>did not give up</em> here.",
      "You deserve friendships where you never have to <strong>shrink</strong>.",
      "<strong>Little daily habits</strong> are turning into the life you want.",
      "You are not hard to love. You are learning to <em>love yourself better</em>.",
      "Keep going. You have not even seen your <strong>favorite version</strong> of yourself yet.",
      "Slay, <strong>queen</strong>. <em>Periodt.</em> That is the message. 💅",
      "Reminder: you already <strong>slayed</strong> today, <em>queen</em>. Periodt. ✨"
    ];

    const ball = document.getElementById("magicBall");
    const windowText = document.getElementById("windowText");
    const shakeButton = document.getElementById("shakeButton");
    const body = document.body;

    const themes = ["theme-1", "theme-2", "theme-3", "theme-4"];
    let currentThemeIndex = 0;
    let isShaking = false;

    // Set initial theme
    body.classList.add(themes[currentThemeIndex]);

    function getRandomMessage() {
      const index = Math.floor(Math.random() * messages.length);
      return messages[index];
    }

    function rotateTheme() {
      body.classList.remove(themes[currentThemeIndex]);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      body.classList.add(themes[currentThemeIndex]);
    }

    function shakeAndReveal() {
      if (isShaking) return; // prevent spamming during animation
      isShaking = true;

      // restart shake animation
      ball.classList.remove("shake");
      void ball.offsetWidth; // force reflow
      ball.classList.add("shake");

      // clear old pop animation
      windowText.classList.remove("pop");

      setTimeout(() => {
        const newMessage = getRandomMessage();

        // rotate theme every shake/click
        rotateTheme();

        // update message with HTML so bold/italic shows
        windowText.innerHTML = newMessage;

        // trigger text pop animation
        void windowText.offsetWidth;
        windowText.classList.add("pop");

        isShaking = false;
      }, 550);
    }

    // Click on ball
    ball.addEventListener("click", shakeAndReveal);

    // Click on button
    shakeButton.addEventListener("click", shakeAndReveal);
  </script>
</body>
</html>
