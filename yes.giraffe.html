<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yippie!!!</title>
  <style>
    :root{
      --bg:#ffd6e8;          /* pink background */
      --ink:#fff;            /* white text */
      --popup-x-left: 22%;   /* bottom/top left anchor (desktop) */
      --popup-x-right: 78%;  /* bottom/top right anchor (desktop) */
    }

    *{ box-sizing:border-box }
    html,body{
      height:100%; margin:0;
      background:var(--bg); color:var(--ink);
      font-family:system-ui,Segoe UI,Roboto,Arial;
      overflow:hidden;
    }

    .container{
      min-height:100%;
      display:grid;
      place-items:center;
      gap:18px;
      padding:24px 24px calc(180px + env(safe-area-inset-bottom));
      text-align:center;
      position:relative;
      z-index:1;
    }

    .header_text{
      font-size:28px;
      font-weight:800;
      margin:0;
    }

    /* Main giraffe (center) */
    .gif_container img{
      width:min(340px,78vw);
      height:auto;
      max-height:46vh;
      border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }

    .text{
      font-size:18px;
      font-weight:700;
      margin-top:6px;
    }

    /* ===== POPUPS ===== */
    .popup{ position:fixed; z-index:2; }
    .popup img{
      width:150px; max-width:24vw;
      height:auto; max-height:18vh;
      border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }

    /* --- Side giraffes (slide in) --- */
    .side{
      top:55%;
      transform:translateY(-50%);
    }
    .side-left{
      left:14px;
      transform:translate(-140%, -50%);
      animation: sideInLeft 1.1s ease-out forwards;
      animation-delay:.5s;
    }
    @keyframes sideInLeft { to { transform:translate(0, -50%);} }

    .side-right{
      right:14px;
      transform:translate(140%, -50%);
      animation: sideInRight 1.1s ease-out forwards;
      animation-delay:.5s;
    }
    @keyframes sideInRight { to { transform:translate(0, -50%);} }

    /* --- Bottom pop-ups --- */
    .bottom-pop{
      bottom:calc(30px + env(safe-area-inset-bottom));
      transform:translate(-50%, 260px);
      animation: popUp 1.4s cubic-bezier(.2,.8,.2,1.05) forwards;
      animation-delay:.8s;
    }
    @keyframes popUp { to { transform:translate(-50%, 0);} }
    .bottom-left{ left:var(--popup-x-left); }
    .bottom-right{ left:var(--popup-x-right); }

    /* --- Top pop-downs --- */
    .top-pop{
      top:calc(50px + env(safe-area-inset-top));
      transform:translate(-50%, -260px);
      animation: dropIn 1.4s cubic-bezier(.2,.8,.2,1.05) forwards;
      animation-delay:.9s;
    }
    @keyframes dropIn { to { transform:translate(-50%, 0);} }
    .top-left{ left:var(--popup-x-left); }
    .top-right{ left:var(--popup-x-right); }

    /* ===== Responsive: phones ===== */
    @media (max-width:920px){
      .header_text{ font-size:22px; }

      .gif_container img{
        width:78%;
        max-height:34vh;
      }

      .popup img{
        width:90px;  
        max-width:22vw; 
        max-height:14vh;
      }

      /* Make bottom popups bigger */
      .bottom-pop img{
        width:150px;
        max-width:34vw;
        max-height:22vh;
      }

      /* move the left/right side giraffes down to cover empty space */
      .side{ top:70%; }  /* <-- key change */

      :root{
        --popup-x-left: 24%;
        --popup-x-right: 76%;
      }

      .top-pop{ top:68px; }

      .container{ padding-bottom: calc(250px + env(safe-area-inset-bottom)); }

      .text{ font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="header_text">Yippie!!!</h1>
    <div class="gif_container">
      <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExejJhaXNweGd0aHU1enB4ZHlsajNvcWJiZXhhemppOXhtb3NuOTE0OSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/HnYWNVA412Qd75WY49/giphy.gif" 
           alt="Cute giraffe" />
    </div>
    <p class="text">Can’t wait to see you on Saturday the 13 &lt;3</p>
  </div>

  <!-- Side giraffes -->
  <div class="popup side side-left">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2FvMGF3OHhzanNvaGg4ankza3FqY3pqY3dycTVyanF2cDFndjBuZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1gOadI4RGkrFpbMF7r/giphy.gif" alt="Left giraffe" />
  </div>
  <div class="popup side side-right">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2FvMGF3OHhzanNvaGg4ankza3FqY3pqY3dycTVyanF2cDFndjBuZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1gOadI4RGkrFpbMF7r/giphy.gif" alt="Right giraffe" />
  </div>

  <!-- Bottom pop-ups -->
  <div class="popup bottom-pop bottom-left">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHBtZm8yNDdtZjlwb3d0YnJvaDU5YWJhbWdhd3hnaG5sbnkybnBsMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JmBXdjfIblJDi/giphy.gif" alt="Bottom left giraffe" />
  </div>
  <div class="popup bottom-pop bottom-right">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHBtZm8yNDdtZjlwb3d0YnJvaDU5YWJhbWdhd3hnaG5sbnkybnBsMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JmBXdjfIblJDi/giphy.gif" alt="Bottom right giraffe" />
  </div>

  <!-- Top pop-downs -->
  <div class="popup top-pop top-left">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZmQxbTRzbnFhbDR3N2NlZ2V6MjFieW1tZ2h0YzAxdWJ1cWp5bXpvMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xULW8LE3usQAw9kSGc/giphy.gif" alt="Top left giraffe" />
  </div>
  <div class="popup top-pop top-right">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZmQxbTRzbnFhbDR3N2NlZ2V6MjFieW1tZ2h0YzAxdWJ1cWp5bXpvMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xULW8LE3usQAw9kSGc/giphy.gif" alt="Top right giraffe" />
  </div>
</body>
</html>
