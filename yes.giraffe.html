<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yippie!!!</title>
  <style>
    :root{
      --bg:#ffd6e8;         /* pink background */
      --ink:#fff;           /* white text */
      --popup-x-left: 20%;  /* left offset (pulled in a bit so it's always visible) */
      --popup-x-right: 80%; /* right offset */
    }
    *{box-sizing:border-box}
    html,body{
      height:100%; margin:0;
      background:var(--bg); color:var(--ink);
      font-family:system-ui,Segoe UI,Roboto,Arial;
      overflow:hidden; /* we position popups fixed */
    }

    .container{
      min-height:100%;
      display:grid;
      place-items:center;
      gap:18px;
      /* extra bottom padding = pushes content UP so text doesn't touch bottom popups */
      padding:24px 24px calc(160px + env(safe-area-inset-bottom));
      text-align:center;
      position:relative;
      z-index:1;
    }
    .header_text{
      font-size:28px;
      font-weight:800;
      margin:0;
      color:var(--ink);
    }

    /* Main giraffe */
    .gif_container img{
      width:min(340px,78vw);
      height:auto;
      max-height:46vh; /* smaller so it never dominates */
      border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }

    .text{
      font-size:18px;
      font-weight:700;
      color:var(--ink);
      margin-top:6px;   /* a little tighter so it sits higher */
    }

    /* ===== Popups (top/bottom + left/right) ===== */
    .popup{ position:fixed; z-index:2; } /* above the centered content */
    .popup img{
      width:160px; max-width:26vw;
      height:auto; max-height:20vh;
      border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }

    /* Slide-in from sides (desktop only) */
    .from-left{
      top:50%; left:-240px; transform:translateY(-50%);
      animation: slideInLeft 1.2s ease-out forwards; animation-delay:.5s;
    }
    @keyframes slideInLeft { 0%{left:-240px;opacity:0;} 100%{left:20px;opacity:1;} }
    .from-right{
      top:50%; right:-240px; transform:translateY(-50%);
      animation: slideInRight 1.2s ease-out forwards; animation-delay:.5s;
    }
    @keyframes slideInRight { 0%{right:-240px;opacity:0;} 100%{right:20px;opacity:1;} }

    /* Bottom pop-ups (parallel) */
    .bottom-pop{
      bottom:-260px;
      transform:translateX(-50%);
      animation: popUp 1.4s cubic-bezier(.2,.8,.2,1.05) forwards;
      animation-delay:.8s;
    }
    @keyframes popUp{
      0%{ bottom:-260px; opacity:0; }
      60%{ bottom:calc(34px + env(safe-area-inset-bottom)); opacity:1; }
      80%{ bottom:calc(24px + env(safe-area-inset-bottom)); }
      100%{ bottom:calc(30px + env(safe-area-inset-bottom)); }
    }
    .bottom-left{ left:var(--popup-x-left); }
    .bottom-right{ left:var(--popup-x-right); }

    /* Top pop-downs (parallel) */
    .top-pop{
      top:-260px;
      transform:translateX(-50%);
      animation: popDown 1.4s cubic-bezier(.2,.8,.2,1.05) forwards;
      animation-delay:.9s;
    }
    @keyframes popDown{
      0%{ top:-260px; opacity:0; }
      60%{ top:calc(54px + env(safe-area-inset-top)); opacity:1; }
      80%{ top:calc(40px + env(safe-area-inset-top)); }
      100%{ top:calc(48px + env(safe-area-inset-top)); }
    }
    .top-left{ left:var(--popup-x-left); }
    .top-right{ left:var(--popup-x-right); }

    /* ===== Responsive tweaks ===== */
    @media (max-width: 920px){
      /* hide side slide-ins on phones for space */
      .from-left,.from-right{ display:none; }

      .header_text{ font-size:22px; }
      .gif_container img{
        width:78%;
        max-height:34vh;
      }
      .popup img{
        width:100px; max-width:22vw; max-height:14vh;
      }
      /* pull popups further in so left one never clips */
      :root{
        --popup-x-left: 24%;
        --popup-x-right: 76%;
      }
      /* make top ones start a touch lower so they don't overlap the title */
      .top-left, .top-right{ top:68px; }
      /* give a bit more padding bottom so text sits higher above bottom popups */
      .container{ padding-bottom: calc(190px + env(safe-area-inset-bottom)); }
      .text{ font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="header_text">Yippie!!!</h1>
    <div class="gif_container">
      <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExejJhaXNweGd0aHU1enB4ZHlsajNvcWJiZXhhemppOXhtb3NuOTE0OSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/HnYWNVA412Qd75WY49/giphy.gif" 
           alt="Cute giraffe" />
    </div>
    <p class="text">Can’t wait to see you on Saturday 13 &lt;3</p>
  </div>

  <!-- Side giraffes (desktop only) -->
  <div class="popup from-left">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2FvMGF3OHhzanNvaGg4ankza3FqY3pqY3dycTVyanF2cDFndjBuZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1gOadI4RGkrFpbMF7r/giphy.gif" alt="Left giraffe" />
  </div>
  <div class="popup from-right">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2FvMGF3OHhzanNvaGg4ankza3FqY3pqY3dycTVyanF2cDFndjBuZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1gOadI4RGkrFpbMF7r/giphy.gif" alt="Right giraffe" />
  </div>

  <!-- Bottom pop-ups (parallel) -->
  <div class="popup bottom-pop bottom-left">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHBtZm8yNDdtZjlwb3d0YnJvaDU5YWJhbWdhd3hnaG5sbnkybnBsMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JmBXdjfIblJDi/giphy.gif" alt="Bottom left giraffe" />
  </div>
  <div class="popup bottom-pop bottom-right">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHBtZm8yNDdtZjlwb3d0YnJvaDU5YWJhbWdhd3hnaG5sbnkybnBsMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JmBXdjfIblJDi/giphy.gif" alt="Bottom right giraffe" />
  </div>

  <!-- Top pop-downs (parallel) -->
  <div class="popup top-pop top-left">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZmQxbTRzbnFhbDR3N2NlZ2V6MjFieW1tZ2h0YzAxdWJ1cWp5bXpvMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xULW8LE3usQAw9kSGc/giphy.gif" alt="Top left giraffe" />
  </div>
  <div class="popup top-pop top-right">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZmQxbTRzbnFhbDR3N2NlZ2V6MjFieW1tZ2h0YzAxdWJ1cWp5bXpvMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xULW8LE3usQAw9kSGc/giphy.gif" alt="Top right giraffe" />
  </div>
</body>
</html>
